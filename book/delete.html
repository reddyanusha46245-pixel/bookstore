<!-- To delete book data -->
<!DOCTYPE html>
<html>

<head>
    <title>Delete Book</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="brand">📚 ANUSHA <span>BOOKSTORE</span>
        <p class="tagline">Good Books • Better Tomorrows</p>
    </div>

    <h1>DELETE BOOK</h1>
    <hr>

    <a href="index.html">Home</a> |
    <a href="list.html">List Books</a> |
    <a href="listOne.html">List Required Book</a> |
    <a href="insert.html">Insert Book</a> |
    <a href="update.html">Update Book</a> |
    <a href="delete.html">Delete Book</a>

    <hr>

    Book Number to Delete
    <input type="number" id="bno">

    <br><br>

    <button onclick="deleteBook()">Delete</button>

    <br><br>

    <button onclick="location.href='index.html'">
        Home Page
    </button>

    <script>
        function deleteBook() {
            let bno = document.getElementById("bno").value;

            if (bno === "") {
                alert("Please enter Book Number");
                return;
            }

            if (confirm("Are you sure you want to delete this book?") == false)
                return;

            fetch("/books/" + bno, {
                method: "DELETE"
            })
                .then(response => {
                    if (response.ok)
                        return response.text();

                    return response.text().then(message => {
                        throw new Error(message);
                    });
                })
                .then(message => {
                    alert(message);
                    location.href = "index.html";
                })
                .catch(error => {
                    alert(error.message);
                });
        }
    </script>

</body>

</html>
